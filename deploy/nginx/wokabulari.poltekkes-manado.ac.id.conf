# Vhost nginx HOST untuk Wokabulari (server 103.181.182.168, nginx 1.18 / Ubuntu).
# Meneruskan permintaan ke container aplikasi di 127.0.0.1:8090 (lihat compose.prod.yaml).
#
# Pasang:
#   sudo cp deploy/nginx/wokabulari.poltekkes-manado.ac.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/wokabulari.poltekkes-manado.ac.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat: pilih SALAH SATU di blok 443 di bawah (lihat docs/DEPLOY-SERVER.md langkah 6).

upstream wokabulari_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

# HTTP → HTTPS. Kamera, mikrofon, dan GPS hanya berjalan di HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name wokabulari.poltekkes-manado.ac.id;

    # Untuk certbot (pilihan B) bila memakai metode webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wokabulari.poltekkes-manado.ac.id;

    # --- Pilihan A: sertifikat wildcard *.poltekkes-manado.ac.id yang sudah dipakai vhost lain.
    #     Salin path persis dari vhost yang ada:  grep -R "ssl_certificate" /etc/nginx/sites-enabled/
    #     PERHATIAN: sertifikat wildcard saat ini berlaku sampai 26 Okt 2026 — pastikan sudah diperbarui.
    ssl_certificate     /etc/ssl/poltekkes-manado/wildcard.crt;   # GANTI dengan path sebenarnya
    ssl_certificate_key /etc/ssl/poltekkes-manado/wildcard.key;   # GANTI dengan path sebenarnya

    # --- Pilihan B: Let's Encrypt khusus subdomain ini (otomatis diperpanjang certbot).
    #     Jalankan: sudo certbot --nginx -d wokabulari.poltekkes-manado.ac.id
    #     certbot akan mengganti dua baris ssl_certificate di atas.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wokabulari_ssl:10m;
    ssl_session_timeout 1d;

    # Unggahan tugas, foto, audio, lampiran (sesuai batas PHP 64 MB di container).
    client_max_body_size 64m;

    # Selfie absen & rekaman suara dikirim sebagai data URI dalam body permintaan.
    client_body_buffer_size 1m;

    access_log /var/log/nginx/wokabulari.access.log;
    error_log  /var/log/nginx/wokabulari.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Header keamanan lain (Permissions-Policy kamera/mikrofon/lokasi, nosniff, dsb.) sudah dikirim aplikasi.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://wokabulari_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Unggahan besar diteruskan langsung (tidak ditampung di disk nginx host).
        proxy_request_buffering off;
    }

    # Aset hasil build (nama berkas mengandung hash) boleh di-cache lama oleh browser.
    location /build/ {
        proxy_pass http://wokabulari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        # add_header di location menimpa milik server, jadi HSTS diulang di sini.
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
